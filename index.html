<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendrier des Émissions</title>
<style>
:root{
  --bg:#0b0d12;
  --surface:#11141b;
  --surface-2:#171b23;
  --surface-3:#1d222c;
  --border:#2a303b;
  --border-soft:#20252e;
  --text:#f4f7fb;
  --muted:#8f98a8;
  --accent:#6ea8ff;
  --accent-2:#3f82f5;
  --success:#35c477;
  --danger:#ff5d78;
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}

body{
  font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(74,126,210,.13),transparent 35%),
    var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  transition:transform .15s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}

button:active{transform:scale(.97)}

h1{
  margin:0;
  font-size:clamp(17px,4vw,23px);
  font-weight:750;
  letter-spacing:-.3px;
}

/* ===== TOPBAR ===== */
#topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(11,13,18,.91);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:12px 18px 15px;
  border-bottom:1px solid rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
}

#topbar.scrolled{
  box-shadow:0 8px 30px rgba(0,0,0,.38);
}

.topbar-header{
  max-width:1800px;
  width:100%;
}

.topbar-header h1{
  display:flex;
  align-items:center;
  gap:9px;
}

/* ===== NAVIGATION ===== */
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
}

.controls button,
#menuToggle{
  border:1px solid var(--border);
  background:linear-gradient(180deg,#202630,#181c24);
  color:var(--text);
  border-radius:9px;
  padding:7px 11px;
  min-height:34px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.controls button:hover,
#menuToggle:hover{
  background:#252c38;
  border-color:#3b4656;
}

#monthLabel{
  min-width:175px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  text-transform:capitalize;
  color:#fff;
}

#toggleViewBtn{
  margin-left:8px;
  background:linear-gradient(135deg,var(--accent-2),#6b9fff)!important;
  border-color:transparent!important;
  box-shadow:0 5px 18px rgba(63,130,245,.22)!important;
}

#toggleViewBtn:hover{
  filter:brightness(1.08);
}

/* ===== MENU ===== */
#menuToggle{
  display:none;
  font-size:18px;
}

#collapsibleMenu{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
}

/* ===== FORMULAIRE ===== */
form{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
  max-width:1100px;
  padding:10px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border-soft);
  border-radius:13px;
}

form input,
form button,
#tmdbKeyInput,
#tmdbSearch{
  padding:8px 10px;
  font-size:13px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#151920;
  color:var(--text);
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}

form input:focus,
#tmdbKeyInput:focus,
#tmdbSearch:focus{
  border-color:#568cf0;
  box-shadow:0 0 0 3px rgba(86,140,240,.13);
  background:#181d25;
}

form input::placeholder,
#tmdbKeyInput::placeholder,
#tmdbSearch::placeholder{
  color:#70798a;
}

#date{width:145px}
#title{flex:1 1 230px;min-width:180px}
#season,#episode{width:112px}

.btn-group{
  display:flex;
  gap:7px;
}

.btn-primary{
  background:linear-gradient(135deg,#3f82f5,#6ca3ff)!important;
  border-color:transparent!important;
  color:#fff;
  font-weight:650;
  box-shadow:0 5px 15px rgba(63,130,245,.2);
}

.btn-primary:hover{filter:brightness(1.08)}

.btn-secondary{
  background:#191e26!important;
  border-color:#303846!important;
  color:#dbe1eb!important;
}

.btn-secondary:hover{
  background:#232a35!important;
  border-color:#414b5c!important;
}

.extra-controls{
  text-align:center;
}

#collapsibleMenu > .extra-controls:has(#tmdbSearch){
  width:100%!important;
  max-width:1100px!important;
}

#tmdbSearch{
  width:100%!important;
  max-width:none!important;
  display:block;
}

.extra-controls label{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

#tmdbKeyInput{
  max-width:none;
}

#tmdbResults{
  background:#151920;
  color:var(--text);
  border:1px solid var(--border);
  max-height:280px;
  overflow-y:auto;
  margin-top:5px;
  border-radius:10px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:1100px;
  text-align:left;
  overflow-x:hidden;
}

#tmdbResults[hidden]{display:none}

#tmdbResults div{
  padding:9px 12px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.045);
}

#tmdbResults div:last-child{border-bottom:0}

#tmdbResults div:hover{
  background:#222936;
}

/* ===== NOTIFICATION ===== */
#notification{
  position:fixed;
  bottom:22px;
  right:22px;
  background:#2678ee;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.38);
  z-index:10000;
  opacity:0;
  transition:opacity .3s,transform .3s;
  transform:translateY(18px);
  max-width:calc(100vw - 44px);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
  font-weight:600;
}

#notification.show{
  opacity:1;
  transform:translateY(0);
}

#notification.error{background:#c83e58}
#notification.info{background:#b77a18}

/* ===== PROGRESS ===== */
#progressContainer{
  width:80%;
  max-width:600px;
  height:7px;
  background:#202631;
  border-radius:99px;
  overflow:hidden;
  margin-top:3px;
  display:none;
}

#progressBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#3f82f5,#73adff);
  transition:width .2s ease;
}

/* ===== CALENDRIER ===== */
main{
  max-width:1900px;
  margin:0 auto;
}

.calendar{
  display:grid;
  gap:7px;
  margin-top:9px;
}

.calendar.month,
.calendar.week{
  grid-template-columns:repeat(7,1fr);
}

.weekdays{
  font-weight:700;
  text-align:center;
  background:transparent;
  border-radius:11px;
  overflow:hidden;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
  margin-top:10px;
}

.weekdays div{
  padding:9px 0;
  border:1px solid var(--border-soft);
  border-radius:9px;
  background:#15181f;
  font-size:12px;
  color:#aeb7c6;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.day{
  border-radius:11px;
  background:linear-gradient(145deg,#15181e,#12151a);
  min-height:145px;
  display:flex;
  flex-direction:column;
  position:relative;
  padding:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .15s,background .2s,border-color .2s;
  border:1px solid var(--border-soft);
  overflow:hidden;
}

.day:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 22px rgba(0,0,0,.32);
  border-color:#303744;
}

.day-number{
  font-weight:750;
  font-size:13px;
  color:#8f99aa;
  position:absolute;
  top:7px;
  right:9px;
  z-index:2;
}

.day.drag-over{
  outline:2px dashed var(--accent);
  outline-offset:-3px;
  background:#151f31;
}

.day.today{
  border-color:rgba(110,168,255,.65);
  box-shadow:0 0 0 1px rgba(110,168,255,.12),0 6px 18px rgba(40,90,170,.16);
}

.day.today .day-number{
  color:#8bb8ff;
  background:rgba(82,140,235,.13);
  border-radius:7px;
  padding:2px 6px;
}

.day:has(.event){
  background:linear-gradient(145deg,#171b22,#13171d);
}

/* ===== EVENTS ===== */
.event{
  background:linear-gradient(135deg,#2788ee,#4f9bf4);
  color:#fff;
  font-size:11.5px;
  margin-top:25px;
  padding:5px 6px;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:7px;
  cursor:grab;
  transition:transform .15s,box-shadow .15s,filter .15s;
  min-height:39px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 3px 9px rgba(0,0,0,.17);
}

.event + .event{margin-top:5px}

.event:active{cursor:grabbing}

.event:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(0,0,0,.3);
  filter:brightness(1.05);
}

.event.watched{
  background:linear-gradient(135deg,#239552,#45bf77);
}

.event img{
  width:26px;
  height:36px;
  object-fit:cover;
  border-radius:5px;
  flex-shrink:0;
  background:rgba(0,0,0,.2);
}

.event > span:not(.btn){
  line-height:1.25;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event .actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-left:auto;
  flex-shrink:0;
}

.event .actions .btn{
  font-size:13px;
  padding:2px;
  cursor:pointer;
  opacity:.85;
  transition:opacity .15s,transform .15s;
}

.event .actions .btn:hover{
  opacity:1;
  transform:scale(1.12);
}

.event .actions input[type="checkbox"]{
  width:13px;
  height:13px;
  margin:0;
  accent-color:#fff;
  cursor:pointer;
}

.event .btn.del{color:#ffe0e5}
.event .btn.dup{color:#fff3bd}

/* ===== MOBILE ===== */
@media (max-width: 900px){
  .day{min-height:125px}
  .event{font-size:11px}
  .event img{width:23px;height:32px}
}

@media (max-width: 640px){
  #topbar{
    padding:10px 10px 12px;
    gap:9px;
  }

  #menuToggle{
    display:block;
  }

  #collapsibleMenu{
    display:none;
  }

  #collapsibleMenu.open{
    display:flex;
  }

  .topbar-header{
    display:flex!important;
    width:100%;
    justify-content:space-between;
    align-items:center;
  }

  .controls{
    width:100%;
    justify-content:space-between;
    gap:6px;
  }

  #monthLabel{
    min-width:0;
    flex:1;
    font-size:14px;
  }

  #toggleViewBtn{
    margin-left:0;
    width:100%;
  }

  form{
    flex-direction:column;
    align-items:stretch;
    padding:9px;
  }

  form input,
  form button,
  #tmdbKeyInput,
  #tmdbSearch{
    width:100%;
    box-sizing:border-box;
  }

  #date,#title,#season,#episode{
    width:100%;
    flex:none;
    min-width:unset;
  }

  .btn-group{
    justify-content:stretch;
  }

  .btn-group button{
    flex:1;
  }

  .extra-controls{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:7px!important;
  }

  .extra-controls button,
  .extra-controls input[type=text]{
    width:100%;
    box-sizing:border-box;
  }

  .weekdays{
    display:none;
  }

  /* Vue mois = agenda mobile */
  .calendar.month{
    display:flex!important;
    flex-direction:column;
    gap:0;
  }

  .calendar.month .day{
    min-height:unset;
    border-radius:0;
    border:none;
    border-bottom:1px solid var(--border-soft);
    padding:10px 10px 9px;
    background:transparent;
    box-shadow:none;
  }

  .calendar.month .day:hover{
    transform:none;
    box-shadow:none;
  }

  .calendar.month .day:empty{
    display:none;
  }

  .calendar.month .day-number{
    position:static;
    display:inline-block;
    font-size:13px;
    color:#9da7b7;
    margin-bottom:5px;
  }

  .calendar.month .day-label{
    font-size:11px;
    color:#697384;
    text-transform:uppercase;
    margin-bottom:5px;
    display:block;
    letter-spacing:.3px;
  }

  .calendar.month .event{
    margin-top:4px;
    font-size:12.5px;
    min-height:43px;
  }

  .calendar.week{
    grid-template-columns:1fr;
    gap:5px;
  }

  .calendar.week .day{
    min-height:58px;
    border-radius:9px;
  }

  .calendar.week .day-number::before{
    content:attr(data-dayname) " ";
    font-size:11px;
    color:#697384;
    font-weight:500;
  }

  .event{
    font-size:13px;
    padding:7px 8px;
  }

  .event img{
    width:28px;
    height:38px;
  }

  .event .btn{
    font-size:15px;
  }

  #notification{
    left:12px;
    right:12px;
    bottom:14px;
    text-align:center;
    max-width:none;
  }
}

/* ==========================================================
   PREMIUM UI — Calendrier des Émissions
   ========================================================== */

:root{
  --premium-accent:#7c9cff;
  --premium-accent-2:#a879ff;
  --premium-glow:rgba(124,156,255,.22);
  --premium-card:rgba(19,23,31,.82);
  --premium-card-strong:#151a23;
}

body{
  background:
    radial-gradient(900px 500px at 12% -8%,rgba(124,156,255,.14),transparent 60%),
    radial-gradient(800px 500px at 88% 0%,rgba(168,121,255,.10),transparent 60%),
    linear-gradient(180deg,#090b10 0%,#0b0e14 55%,#090b10 100%);
}

/* Topbar premium */
#topbar{
  padding:14px 20px 16px;
  background:rgba(8,10,15,.78);
  border-bottom:1px solid rgba(255,255,255,.075);
}

.topbar-header h1{
  font-size:22px;
  letter-spacing:-.6px;
}

.topbar-header h1:first-letter{
  filter:drop-shadow(0 0 8px rgba(124,156,255,.55));
}

.controls{
  max-width:1100px;
  margin:auto;
}

.controls button{
  min-width:38px;
  border-radius:10px;
}

#monthLabel{
  font-size:17px;
  min-width:220px;
}

#toggleViewBtn{
  padding:8px 14px!important;
}

/* Statistiques */
#premiumStats{
  width:100%;
  max-width:1100px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 auto 2px;
}

.premium-stat{
  position:relative;
  overflow:hidden;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:linear-gradient(145deg,rgba(25,30,40,.9),rgba(14,17,23,.9));
  box-shadow:0 7px 22px rgba(0,0,0,.16);
}

.premium-stat::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-35px;
  top:-35px;
  border-radius:50%;
  background:var(--premium-glow);
  filter:blur(2px);
}

.premium-stat-label{
  display:block;
  color:#7f8999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:700;
}

.premium-stat-value{
  display:block;
  margin-top:2px;
  color:#f6f8fc;
  font-size:20px;
  line-height:1.1;
  font-weight:800;
}

.premium-stat-sub{
  color:#667080;
  font-size:10px;
}

/* Zone outils */
#collapsibleMenu{
  width:100%;
  max-width:1100px;
}

form{
  position:relative;
  background:linear-gradient(145deg,rgba(24,29,39,.92),rgba(14,17,23,.92));
  border-color:rgba(255,255,255,.075);
  box-shadow:0 12px 35px rgba(0,0,0,.15);
}

form::before{
  content:"AJOUTER / MODIFIER";
  position:absolute;
  left:12px;
  top:-8px;
  padding:0 7px;
  background:#10141b;
  color:#697486;
  font-size:9px;
  letter-spacing:1px;
  font-weight:800;
}

/* Recherche TMDB */
#tmdbSearch{
  width:100%!important;
  max-width:none!important;
  height:39px;
  background:rgba(20,24,32,.92);
}

#tmdbKeySetup{
  animation:premiumKeyFade .25s ease;
}
@keyframes premiumKeyFade{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

#tmdbSearch::placeholder{
  color:#667184;
}

/* Boutons */
.btn-primary{
  background:linear-gradient(135deg,#597ff5,#8b72f7)!important;
  box-shadow:0 7px 22px rgba(92,121,246,.24)!important;
}

.btn-secondary{
  background:linear-gradient(180deg,#1b212b,#151a22)!important;
}

/* En-têtes calendrier */
.weekdays{
  position:sticky;
  top:108px;
  z-index:50;
  padding:0 1px;
  background:transparent;
}

.weekdays div{
  background:linear-gradient(180deg,#1a202a,#151a22);
  border-color:#252c37;
  box-shadow:0 4px 13px rgba(0,0,0,.16);
}

/* Cellules */
.day{
  min-height:152px;
  border-color:#222832;
  background:
    linear-gradient(145deg,rgba(22,26,34,.96),rgba(14,17,23,.96));
}

.day:hover{
  border-color:#353e4d;
}

.day.today{
  border-color:rgba(124,156,255,.72);
  box-shadow:
    0 0 0 1px rgba(124,156,255,.10),
    0 0 28px rgba(76,108,190,.10),
    0 10px 24px rgba(0,0,0,.28);
}

.day.today::before{
  content:"AUJOURD’HUI";
  position:absolute;
  top:7px;
  left:7px;
  padding:2px 6px;
  border-radius:5px;
  background:rgba(124,156,255,.12);
  color:#8eaeff;
  font-size:8px;
  letter-spacing:.65px;
  font-weight:800;
}

.day-number{
  font-size:13px;
  color:#8994a6;
}

/* Événements premium */
.event{
  position:relative;
  min-height:44px;
  padding:6px 7px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(135deg,rgba(54,137,238,.96),rgba(71,105,225,.96));
  box-shadow:0 5px 13px rgba(0,0,0,.20);
}

.event.watched{
  background:
    linear-gradient(135deg,rgba(35,157,87,.97),rgba(49,177,107,.97));
}

.event:hover{
  box-shadow:0 8px 20px rgba(0,0,0,.30);
}

.event img{
  width:29px;
  height:38px;
  border-radius:6px;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
}

.event > span:not(.btn){
  font-weight:600;
}

.event .actions{
  gap:4px;
}

.event .actions .btn{
  opacity:.75;
}

/* Légende */
#premiumLegend{
  max-width:1100px;
  width:100%;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:14px;
  color:#737e8f;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  box-shadow:0 0 8px currentColor;
}

.legend-dot.next{color:#4f9bf4;background:#4f9bf4}
.legend-dot.watched{color:#45bf77;background:#45bf77}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0c0f14}
::-webkit-scrollbar-thumb{
  background:#2b3340;
  border-radius:99px;
}
::-webkit-scrollbar-thumb:hover{background:#3c4656}

/* Mobile premium */
@media(max-width:640px){
  #topbar{
    padding:10px 10px 12px;
  }

  .topbar-header h1{
    font-size:18px;
  }

  #premiumStats{
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }

  .premium-stat{
    padding:8px 10px;
  }

  .premium-stat-value{
    font-size:18px;
  }

  .weekdays{
    position:static;
  }

  #premiumLegend{
    justify-content:center;
    padding:3px 0 5px;
  }

  .day.today::before{
    display:none;
  }
}


/* ===== PALETTE COULEUR PREMIUM ===== */
:root{
  --c-blue:#4f9bf4;
  --c-purple:#9b78ff;
  --c-pink:#ed6cae;
  --c-orange:#f5a64a;
  --c-yellow:#e6c75a;
  --c-green:#45c27a;
  --c-cyan:#42c8d8;

/* ==========================================================
   V5 — NEON / STREAMING DASHBOARD
   ========================================================== */

:root{
  --fly-blue:#42a5ff;
  --fly-violet:#9b6cff;
  --fly-pink:#ff5fa2;
  --fly-cyan:#42e8ff;
  --fly-green:#43df8a;
  --fly-gold:#ffc45c;
  --fly-bg:#07090f;
  --fly-panel:rgba(13,17,27,.88);
  --fly-line:rgba(255,255,255,.08);
}

/* Fond plus spectaculaire */
body{
  background:
    radial-gradient(700px 360px at 8% -5%,rgba(66,165,255,.17),transparent 65%),
    radial-gradient(700px 360px at 92% 0%,rgba(155,108,255,.16),transparent 65%),
    radial-gradient(600px 330px at 55% 100%,rgba(255,95,162,.07),transparent 65%),
    linear-gradient(180deg,#05070b 0%,#090d15 48%,#06080d 100%);
}

/* Liseré lumineux supérieur */
#topbar{
  position:sticky;
  background:
    linear-gradient(180deg,rgba(7,10,16,.96),rgba(7,10,16,.80));
  border-bottom:1px solid rgba(103,157,255,.20);
  box-shadow:0 8px 35px rgba(0,0,0,.28);
}

#topbar::after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,#4fa3ff 25%,#a56eff 60%,#ff61a8 82%,transparent);
  opacity:.55;
}

/* Titre */
.topbar-header h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:850;
  letter-spacing:.1px;
  text-shadow:0 2px 0 #34200f,0 4px 12px rgba(0,0,0,.55);
}

.topbar-header h1::after{
  content:"";
  display:block;
}

/* Navigation */
.controls button{
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,#1b2230,#111721);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 5px 16px rgba(0,0,0,.22);
}

.controls button:hover{
  border-color:rgba(102,170,255,.52);
  box-shadow:
    0 0 0 1px rgba(102,170,255,.08),
    0 8px 22px rgba(31,95,180,.16);
}

#monthLabel{
  font-size:18px;
  font-weight:850;
  text-shadow:0 0 15px rgba(126,170,255,.13);
}

#toggleViewBtn{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#377df2 0%,#7a5ff2 55%,#b867d7 100%)!important;
  box-shadow:
    0 7px 24px rgba(84,110,241,.25),
    inset 0 1px 0 rgba(255,255,255,.17)!important;
}

#toggleViewBtn::after{
  content:"";
  position:absolute;
  top:-80%;
  left:-25%;
  width:35%;
  height:260%;
  transform:rotate(22deg);
  background:rgba(255,255,255,.14);
  transition:left .5s ease;
}

#toggleViewBtn:hover::after{left:120%}

/* Stats */
#premiumStats{
  gap:10px;
}

.premium-stat{
  background:
    linear-gradient(145deg,rgba(21,27,39,.94),rgba(9,12,18,.92));
  border-color:rgba(255,255,255,.07);
  box-shadow:
    0 10px 28px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.premium-stat:nth-child(1){
  box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(66,165,255,.11);
}
.premium-stat:nth-child(2){
  box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,196,92,.11);
}
.premium-stat:nth-child(3){
  box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(67,223,138,.11);
}
.premium-stat:nth-child(4){
  box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(155,108,255,.11);
}

.premium-stat-value{
  letter-spacing:-.7px;
}

/* Formulaire / recherche */
form{
  background:
    linear-gradient(145deg,rgba(20,26,37,.92),rgba(9,12,18,.92));
  border:1px solid rgba(95,143,222,.17);
  box-shadow:
    0 14px 36px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.035);
}

form::before{
  color:#7798cf;
  background:#0b1018;
  border:1px solid rgba(90,138,220,.10);
  border-bottom:0;
  border-radius:5px 5px 0 0;
  padding-top:1px;
}

#tmdbSearch{
  border-color:rgba(114,150,211,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}

#tmdbSearch:focus{
  border-color:rgba(110,166,255,.68);
  box-shadow:
    0 0 0 3px rgba(81,139,240,.12),
    0 0 25px rgba(65,139,255,.10);
}

/* ===== Boutons Export / Import centrés ===== */
#collapsibleMenu > .extra-controls:last-of-type{
  width:100%!important;
  max-width:1100px!important;
  display:flex!important;
  justify-content:center!important;
  align-items:center;
  gap:10px!important;
  flex-wrap:wrap;
  text-align:center;
}

#exportBtn,#importBtn,#deleteSeriesBtn,#renameSeriesBtn{

}

#exportBtn{
  background:linear-gradient(135deg,#176fd1,#3499ff)!important;
  border-color:rgba(114,192,255,.35)!important;
  box-shadow:0 7px 22px rgba(37,130,225,.18);
}

#importBtn{
  background:linear-gradient(135deg,#654fd2,#976df6)!important;
  border-color:rgba(181,155,255,.30)!important;
  box-shadow:0 7px 22px rgba(121,92,221,.17);
}

#deleteSeriesBtn{
  background:linear-gradient(135deg,#a93755,#ef617b)!important;
}

#renameSeriesBtn{
  background:linear-gradient(135deg,#b9792f,#e7aa4c)!important;
}

/* Jours */
.weekdays div{
  background:linear-gradient(180deg,#1a2230,#111720);
  border-color:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

.day{
  background:
    linear-gradient(145deg,rgba(19,24,33,.95),rgba(10,14,20,.96));
  border-color:rgba(255,255,255,.065);
  box-shadow:
    0 5px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.018);
}

.day:hover{
  border-color:rgba(108,162,240,.30);
  box-shadow:
    0 10px 25px rgba(0,0,0,.28),
    0 0 0 1px rgba(79,145,236,.07);
}

.day.today{
  background:
    radial-gradient(circle at 12% 12%,rgba(66,165,255,.11),transparent 36%),
    linear-gradient(145deg,rgba(20,29,45,.98),rgba(10,14,20,.98));
}

/* Épisodes */
.event{
  border:none;
  box-shadow:
    0 5px 14px rgba(0,0,0,.23),
    inset 0 1px 0 rgba(255,255,255,.17);
  font-weight:600;
}

.event:not(.watched):nth-child(2n){
  background:linear-gradient(135deg,#2689ee,#4f73ee);
}

.event:not(.watched):nth-child(3n){
  background:linear-gradient(135deg,#7059dc,#9b69ea);
}

.event:not(.watched):nth-child(4n){
  background:linear-gradient(135deg,#d9578c,#ef75a5);
}

.event:not(.watched):nth-child(5n){
  background:linear-gradient(135deg,#db8742,#efb255);
}

.event.watched{
  background:linear-gradient(135deg,#1caa61,#43d786);
  box-shadow:
    0 5px 14px rgba(0,0,0,.23),

    inset 0 1px 0 rgba(255,255,255,.16);
}

/* Affiches */
.event img{
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 3px 10px rgba(0,0,0,.32);
}

/* Actions */
.event .actions .btn{
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}

/* Légende */
#premiumLegend{
  border:1px solid rgba(255,255,255,.045);
  border-radius:9px;
  background:rgba(16,20,28,.50);
  padding:6px 10px;
  width:auto;
}

/* Mobile */
@media(max-width:640px){
  #collapsibleMenu > .extra-controls:last-of-type{
    gap:7px!important;
  }

  #exportBtn,#importBtn{
    flex:1 1 150px;
  }

  #premiumLegend{
    width:100%;
  }
}


/* ===== CORRECTION LARGEUR CALENDRIER ===== */
main{
  width:100%;
  max-width:1900px;
  margin:0 auto;
  min-width:0;
}

.calendar,
.weekdays{
  width:100%;
  min-width:0;
}

.calendar.month,
.calendar.week{
  grid-template-columns:repeat(7,minmax(0,1fr))!important;
}

.weekdays{
  grid-template-columns:repeat(7,minmax(0,1fr))!important;
}

.day{
  min-width:0;
  width:auto;
}


/* ==========================================================
   MOBILE / TABLET — V7
   ========================================================== */

/* Tablette / petits portables : conserver une vraie grille de 7 jours,
   mais éviter les cellules trop serrées. */
@media (max-width: 1100px) and (min-width: 641px){
  body{overflow-x:hidden}

  main{
    padding:0 8px!important;
    max-width:none;
  }

  .calendar.month,
  .calendar.week,
  .weekdays{
    grid-template-columns:repeat(7,minmax(110px,1fr))!important;
  }

  .calendar.month,
  .calendar.week{
    overflow-x:auto;
    width:100%;
    padding-bottom:8px;
  }

  .calendar.month .day,
  .calendar.week .day{
    min-width:110px;
  }

  .weekdays{
    overflow-x:auto;
  }

  .weekdays div{
    min-width:110px;
  }
}

/* Téléphone : transformation en agenda lisible.
   On conserve toutes les fonctions de clic / drag-and-drop. */
@media (max-width:640px){
  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  #topbar{
    position:sticky;
    top:0;
    width:100%;
    padding:9px 9px 11px;
  }

  .topbar-header{
    width:100%!important;
  }

  .topbar-header h1{
    font-size:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:calc(100% - 52px);
  }

  .controls{
    display:grid;
    grid-template-columns:40px minmax(0,1fr) 40px;
    gap:7px;
  }

  .controls button{
    width:100%;
    min-width:0;
    padding:7px 4px;
  }

  #monthLabel{
    min-width:0;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  #toggleViewBtn{
    grid-column:1 / -1;
    width:100%;
    margin:0;
  }

  #premiumStats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:100%;
    gap:6px;
  }

  .premium-stat{
    min-width:0;
    padding:8px 9px;
  }

  .premium-stat-label,
  .premium-stat-sub{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #collapsibleMenu{
    width:100%;
    max-width:none;
  }

  form{
    width:100%!important;
    max-width:none!important;
  }

  #tmdbSearch{
    width:100%!important;
    min-width:0;
  }

  .export-actions{
    width:100%!important;
    max-width:none!important;
  }

  #exportBtn,#importBtn{
    flex:1 1 0;
    min-width:0;
  }

  /* Mois : agenda par jour, beaucoup plus lisible sur téléphone */
  .weekdays{
    display:none!important;
  }

  .calendar.month{
    display:flex!important;
    flex-direction:column!important;
    gap:0!important;
    width:100%!important;
    min-width:0!important;
    overflow:visible!important;
  }

  .calendar.month .day{
    display:block;
    width:100%!important;
    min-width:0!important;
    min-height:0!important;
    padding:10px 9px 11px;
    border-radius:0;
    border-left:0;
    border-right:0;
    border-top:0;
    border-bottom:1px solid rgba(255,255,255,.07);
    box-shadow:none;
    overflow:visible;
  }

  .calendar.month .day:hover{
    transform:none;
    box-shadow:none;
  }

  .calendar.month .day:empty{
    display:none!important;
  }

  .calendar.month .day-label{
    display:block;
    width:max-content;
    max-width:100%;
    margin-bottom:5px;
    color:#8894a8;
    font-size:10px;
    font-weight:750;
    letter-spacing:.8px;
    text-transform:uppercase;
  }

  .calendar.month .day-number{
    display:none!important;
  }

  .calendar.month .event{
    width:100%;
    margin-top:5px;
    min-height:47px;
    padding:7px 8px;
    font-size:13px;
    border-radius:9px;
  }

  .calendar.month .event img{
    width:30px;
    height:40px;
  }

  .calendar.month .event > span:not(.btn){
    flex:1 1 auto;
    min-width:0;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
  }

  .calendar.month .event .actions{
    margin-left:auto;
  }

  /* Vue semaine : une carte complète par jour */
  .calendar.week{
    display:flex!important;
    flex-direction:column!important;
    gap:6px!important;
    width:100%!important;
    min-width:0!important;
  }

  .calendar.week .day{
    width:100%!important;
    min-width:0!important;
    min-height:66px;
    padding:9px;
    border-radius:10px;
  }

  .calendar.week .day-number{
    position:static;
    display:block;
    margin-bottom:5px;
    color:#aab4c4;
    font-size:12px;
  }

  .calendar.week .day-number::before{
    content:attr(data-dayname) " • ";
    color:#6e798b;
    font-size:11px;
    font-weight:650;
  }

  .calendar.week .event{
    margin-top:5px;
    min-height:45px;
  }

  .premium-stat-value{
    font-size:17px;
  }

  #premiumLegend{
    justify-content:center;
    width:100%;
    font-size:9px;
    gap:10px;
  }

  #notification{
    left:10px;
    right:10px;
    bottom:10px;
  }
}

.captqc-header h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(21px,2.3vw,31px);
  letter-spacing:.2px;
  color:#f0ddbd;
  text-shadow:
    0 2px 0 #34200f,
    0 4px 12px rgba(0,0,0,.55);
}

.captqc-header h1 span{
  color:#f0ddbd;
  -webkit-text-fill-color:#f0ddbd;
  background:none;
}

.captqc-subtitle{
  color:#778da0;
  font-size:9px;
  font-weight:750;
  letter-spacing:1.6px;
  margin-top:2px;
}

#menuToggle{
  border-radius:8px!important;
  background:linear-gradient(145deg,#2a2118,#17130f)!important;
  border:1px solid rgba(201,148,78,.50)!important;
  color:#f0d8af!important;
}

/* Navigation façon laiton */
.controls button{
  border-radius:8px!important;
  background:
    linear-gradient(180deg,#263644,#111b25)!important;
  border-color:rgba(188,143,78,.45)!important;
  color:#ead7b8!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 4px 11px rgba(0,0,0,.28);
}

.controls button:hover{
  border-color:rgba(228,189,121,.84)!important;
  box-shadow:
    0 0 0 1px rgba(201,148,78,.10),
    0 7px 18px rgba(0,0,0,.35);
}

#monthLabel{
  font-family:Georgia,"Times New Roman",serif;
  color:#edd5aa;
  -webkit-text-fill-color:#edd5aa;
  background:none;
  text-transform:uppercase;
  letter-spacing:1px;
}

/* Panneaux */
form,
#tmdbSearch,
.premium-stat,
.weekdays div,
.day,
#tmdbResults{
  border-color:rgba(170,124,62,.28)!important;
}

form{
  background:
    linear-gradient(145deg,rgba(44,28,18,.93),rgba(12,19,26,.96));
  box-shadow:
    0 14px 30px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(237,207,160,.06);
}

form::before{
  content:"⚜ AJOUTER / MODIFIER ⚜";
  background:#20140d;
  color:#d6aa67;
  border-color:rgba(190,143,78,.33);
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:1.1px;
}

form input,#tmdbKeyInput,#tmdbSearch{
  background:
    linear-gradient(180deg,#111b24,#0b1219)!important;
  border-color:rgba(172,127,67,.34)!important;
  color:#eadbbe!important;
}

form input:focus,#tmdbKeyInput:focus,#tmdbSearch:focus{
  border-color:rgba(221,181,110,.80)!important;
  box-shadow:0 0 0 3px rgba(193,140,66,.11),0 0 18px rgba(193,140,66,.08)!important;
}

/* Boutons principaux */
.btn-primary{
  background:linear-gradient(135deg,#765024,#d1a057 54%,#8d5c28)!important;
  border-color:#d6aa66!important;
  color:#101010!important;
  box-shadow:0 7px 18px rgba(114,74,28,.28)!important;
}

.btn-secondary{
  background:linear-gradient(180deg,#1a2934,#0d1720)!important;
  border-color:rgba(189,143,79,.42)!important;
  color:#dfc49a!important;
}

.btn-secondary:hover{
  background:linear-gradient(180deg,#223744,#111d27)!important;
  border-color:#d1a15e!important;
}

#toggleViewBtn{
  background:linear-gradient(135deg,#765024,#c4934e 50%,#765024)!important;
  color:#111!important;
  border-color:#e3bd7c!important;
  box-shadow:0 7px 22px rgba(125,83,31,.22)!important;
}

/* Stats */
.premium-stat{
  background:
    linear-gradient(145deg,rgba(39,26,18,.88),rgba(10,18,25,.96));
}

.premium-stat-label{
  color:#9a7b54;
}

.premium-stat-value{
  color:#e7c27f!important;
  font-family:Georgia,"Times New Roman",serif;
}

/* Jours de la semaine = plaques */
.weekdays div{
  background:
    linear-gradient(180deg,#1c2a35,#101920)!important;
  color:#e4c28e!important;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:1px;
  text-shadow:0 1px 0 #07090b;
}

/* Grille */
.day{
  background:
    linear-gradient(145deg,rgba(17,31,42,.97),rgba(8,15,21,.98));
  border-color:rgba(156,112,58,.27)!important;
  box-shadow:
    0 6px 17px rgba(0,0,0,.33),
    inset 0 1px 0 rgba(255,255,255,.018);
}

.day:hover{
  border-color:rgba(209,161,92,.58)!important;
}

.day-number{
  color:#d1ac70!important;
  font-family:Georgia,"Times New Roman",serif;
}

.day.today{
  border-color:#d3a35e!important;
  box-shadow:
    0 0 0 1px rgba(211,163,94,.13),
    0 0 20px rgba(211,163,94,.09),
    0 10px 24px rgba(0,0,0,.36);
}

.day.today::before{
  content:"⚓ AUJOURD’HUI";
  color:#e6c17f;
  background:rgba(79,50,23,.38);
  border:1px solid rgba(204,157,86,.25);
  font-family:Georgia,"Times New Roman",serif;
}

/* Épisodes comme petites plaques */
.event{
  border-radius:7px;
  background:
    linear-gradient(135deg,#1d5577,#315f78);
  border:1px solid rgba(213,169,96,.37)!important;
  box-shadow:
    0 4px 10px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.10);
  color:#f6ead3;
}

.event:not(.watched):nth-child(3n){
  background:linear-gradient(135deg,#33557a,#49688c);
}
.event:not(.watched):nth-child(4n){
  background:linear-gradient(135deg,#5e465f,#77516d);
}
.event:not(.watched):nth-child(5n){
  background:linear-gradient(135deg,#725331,#8f683c);
}

.event.watched{
  background:linear-gradient(135deg,#245b40,#32734e);
  border-color:rgba(201,161,96,.44)!important;
}

.event img{
  border:1px solid rgba(220,178,105,.42)!important;
}

.event .actions .btn{
  color:#eed6ac!important;
}

.event .actions input[type="checkbox"]{
  accent-color:#c49a5a!important;
}

/* Export/import */
.export-actions{
  padding-top:2px;
  padding-bottom:2px;
}

#exportBtn{
  background:linear-gradient(135deg,#3d2a18,#8c6232)!important;
  color:#f2d7a8!important;
}

#importBtn{
  background:linear-gradient(135deg,#19364a,#315e78)!important;
  color:#dbedf6!important;
}

/* Barre TMDB */
#tmdbSearch{
  color:#e7dcc8!important;
}

/* Légende */
#premiumLegend{
  background:rgba(27,20,14,.70);
  border-color:rgba(181,132,68,.24);
  color:#bca27d;
}

/* Section title */
.captqc-section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 2px 7px;
  padding:7px 10px;
  border:1px solid rgba(157,111,55,.23);
  border-radius:8px;
  background:linear-gradient(90deg,rgba(49,31,18,.68),rgba(13,22,30,.82),rgba(49,31,18,.68));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

.captqc-anchor{
  font-size:19px;
  color:#c99852;
  text-shadow:0 0 8px rgba(201,152,82,.18);
}

.captqc-section-title .section-kicker{
  display:block;
  color:#8d6d45;
  font-size:8px;
  letter-spacing:1.6px;
  font-weight:850;
}

.captqc-section-title strong{
  color:#d8bc8f;
  font-family:Georgia,"Times New Roman",serif;
  font-size:12px;
  letter-spacing:1.1px;
}

.section-line{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,#754b22,rgba(205,157,88,.24),transparent);
}

/* Footer */
#captqcFooter{
  max-width:1900px;
  margin:18px auto 0;
  padding:0 10px 18px;
  color:#a48357;
  text-align:center;
}

.footer-rope{
  height:5px;
  border-radius:999px;
  background:
    repeating-linear-gradient(
      135deg,
      #80552c 0 7px,
      #c39656 7px 13px,
      #765026 13px 20px
    );
  opacity:.75;
  box-shadow:0 0 8px rgba(0,0,0,.35);
}

.footer-content{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:13px;
  margin-top:8px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:11px;
  letter-spacing:1.6px;
  color:#c49a5e;
  text-shadow:0 1px 0 #08090a;
}

.footer-fleur{
  color:#d5a762;
  font-size:13px;
}

/* Responsive CAPTQC */
@media(max-width:640px){
  .captqc-plaque{
    height:105px;
    width:110%;
    opacity:.11;
  }

  .captqc-header{
    min-height:68px;
    gap:8px;
  }

  .captqc-seal{
    width:49px;
    height:49px;
  }

  .captqc-kicker{
    font-size:7px;
    letter-spacing:1.2px;
  }

  .captqc-header h1{
    font-size:18px;
  }

  .captqc-subtitle{
    font-size:7px;
    letter-spacing:1px;
  }

  .captqc-section-title{
    margin-top:9px;
  }

  .footer-content{
    flex-wrap:wrap;
    font-size:9px;
    letter-spacing:1px;
  }
}

</style>

const TMDB_API_KEY_DEFAULT = "⚠️_TA_CLE_V3_ICI_⚠️";
const tmdbKeyInput = document.getElementById("tmdbKeyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");
function getApiKey(){ return localStorage.getItem("tmdb_api_key") || TMDB_API_KEY_DEFAULT; }
function setApiKey(k){ localStorage.setItem("tmdb_api_key", k); }
function updateTMDBKeySetupVisibility(){

  updateTMDBKeySetupVisibility();
  notify("🔑 Clé TMDB enregistrée");
});

/* ========================================================== */
/* HAMBURGER MENU */
/* ========================================================== */
document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("collapsibleMenu").classList.toggle("open");
});

/* ========================================================== */
/* GITHUB GIST SYNC */
/* ========================================================== */
const GIST_ID = "44b66da1327bc6628b20015454c3b022";
const GIST_TOKEN = "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";
const GIST_FILENAME = "calendrier.json";
const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;

async function loadFromCloud(){
  try{
    const res = await fetch(GIST_URL, {
      headers:{"Authorization": `token ${GIST_TOKEN}`, "Accept": "application/vnd.github.v3+json"}
    });
    const data = await res.json();
    const raw = data.files?.[GIST_FILENAME]?.content;
    if(raw){
      const parsed = JSON.parse(raw);
      const remote = Array.isArray(parsed) ? parsed : (parsed.events || null);
      // Ne jamais écraser avec un Gist vide si on a des données locales
      const local = JSON.parse(localStorage.getItem("events") || "[]");
      if(remote !== null && remote.length > 0){
        events = remote;
        localStorage.setItem("events", JSON.stringify(events));
      } else if(local.length > 0){
        // Gist vide mais données locales présentes : on pousse le local vers le Gist
        events = local;
        saveToCloud();
      }
    }
  }catch(err){
    console.error("Erreur chargement Gist:", err);
    // Fallback localStorage
    const local = JSON.parse(localStorage.getItem("events") || "[]");
    if(local.length > 0) events = local;
  }
}

async function saveToCloud(){
  try{
    await fetch(GIST_URL, {
      method:"PATCH",
      headers:{"Authorization": `token ${GIST_TOKEN}`, "Accept": "application/vnd.github.v3+json", "Content-Type":"application/json"},
      body: JSON.stringify({files:{[GIST_FILENAME]:{content: JSON.stringify(events)}}})
    });
  }catch(err){ console.error("Erreur sauvegarde Gist:", err); }
}

/* ========================================================== */
/* DONNÉES */
/* ========================================================== */
let events = JSON.parse(localStorage.getItem("events")) || [];
let viewMode = "month", currentDate = new Date();
let currentSeriesTitle = null;

function saveEvents(){
  localStorage.setItem("events", JSON.stringify(events));
  saveToCloud();
}

function notify(msg, type="success"){
  const n=document.getElementById("notification");
  n.className=""; n.textContent=msg;
  if(type==="error") n.classList.add("error");
  if(type==="info") n.classList.add("info");
  n.classList.add("show");
  setTimeout(()=>n.classList.remove("show"), 2500);
}

function updatePremiumStats(){
  const total=events.length;
  const watched=events.filter(e=>e.watched).length;
  const series=new Set(events.map(e=>e.title).filter(Boolean)).size;
  const toWatch=total-watched;

  const el=id=>document.getElementById(id);
  if(el("statEpisodes")) el("statEpisodes").textContent=total;
  if(el("statToWatch")) el("statToWatch").textContent=toWatch;
  if(el("statWatched")) el("statWatched").textContent=watched;
  if(el("statSeries")) el("statSeries").textContent=series;
}

/* ========================================================== */
/* CALENDRIER */
/* ========================================================== */
const cal = document.getElementById("calendar");
const monthLabel = document.getElementById("monthLabel");
const toggleViewBtn = document.getElementById("toggleViewBtn");
const dateInput = document.getElementById("date");
const titleInput = document.getElementById("title");
const seasonInput = document.getElementById("season");
const episodeInput = document.getElementById("episode");
const editIndexInput = document.getElementById("editIndex");

const isMobile = () => window.innerWidth <= 640;

// Noms courts des jours pour la vue semaine mobile
const DAYNAMES = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];

function generateCalendar(){
  cal.innerHTML="";
  if(viewMode==="month") generateMonth(currentDate);
  else generateWeek(currentDate);
  updatePremiumStats();
}

function generateMonth(date){
  cal.className="calendar month";
  const y=date.getFullYear(), m=date.getMonth();
  monthLabel.textContent=date.toLocaleString("fr-FR",{month:"long",year:"numeric"});
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=(first.getDay()+6)%7, days=last.getDate();

  if(isMobile()){
    // Vue agenda sur mobile : liste tous les jours du mois
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dd = new Date(y,m,d);
      cal.appendChild(renderDay(ds,d,dd));
    }
  } else {
    // Vue grille desktop
    for(let i=0;i<start;i++){const empty=document.createElement("div");empty.className="day";cal.appendChild(empty);}
    for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;cal.appendChild(renderDay(ds,d));}
  }
}

function generateWeek(date){
  cal.className="calendar week";
  const y=date.getFullYear(),m=date.getMonth(),d=date.getDate();
  const cur=new Date(y,m,d), monday=new Date(cur);
  monday.setDate(d-((cur.getDay()+6)%7));
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  monthLabel.textContent=`Semaine du ${monday.getDate()} ${monday.toLocaleString("fr-FR",{month:"long"})} ${monday.getFullYear()}`;
  for(let i=0;i<7;i++){
    const dd=new Date(monday); dd.setDate(monday.getDate()+i);
    const ds=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`;
    cal.appendChild(renderDay(ds,dd.getDate(),dd));
  }
}

function renderDay(dateStr,dnum,dateObj){
  const day=document.createElement("div");
  day.className="day";
  day.dataset.date=dateStr;
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  if(dateStr===todayStr) day.classList.add("today");
  day.dataset.hasEvents="false";

  day.addEventListener("click",(e)=>{ if(!e.target.closest(".event")) dateInput.value=dateStr; });
  day.addEventListener("dragover",e=>{e.preventDefault(); day.classList.add("drag-over");});
  day.addEventListener("dragleave",()=>day.classList.remove("drag-over"));
  day.addEventListener("drop",e=>{
    e.preventDefault(); day.classList.remove("drag-over");
    const idx=e.dataTransfer.getData("text/plain");
    if(idx){events[idx].date=dateStr; saveEvents(); generateCalendar();}
  });

  const num=document.createElement("div");
  num.className="day-number";
  if(isMobile() && dateObj){
    // Sur mobile vue agenda, afficher "Lun 4 sept."
    const label = document.createElement("span");
    label.className="day-label";
    label.textContent=dateObj instanceof Date
      ? dateObj.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})
      : "";
    day.appendChild(label);
  } else {
    num.textContent=dnum;
    // Pour vue semaine mobile : ajouter le nom du jour
    if(isMobile() && viewMode==="week" && dateObj instanceof Date){
      num.dataset.dayname=DAYNAMES[dateObj.getDay()];
    }
    day.appendChild(num);
  }

  events.forEach((ev,idx)=>{
    if(ev.date!==dateStr) return;
    day.dataset.hasEvents="true";
    const item=document.createElement("div"); item.className="event"; if(ev.watched)item.classList.add("watched");
    item.draggable=true; item.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",idx);});

    if(ev.poster){const a=document.createElement("a"); a.href=ev.tmdbUrl||"#"; a.target="_blank"; const img=document.createElement("img"); img.src=ev.poster; a.appendChild(img); item.appendChild(a);}

    const label=document.createElement("span");
    label.textContent=`${ev.title} - ${ev.season}${ev.episode}`;
    label.title=label.textContent;
    const actions=document.createElement("div"); actions.className="actions";

    const chk=document.createElement("input"); chk.type="checkbox"; chk.checked=ev.watched;
    chk.addEventListener("change",()=>{ev.watched=chk.checked; saveEvents(); generateCalendar();});

    const dup=document.createElement("span"); dup.className="btn dup"; dup.textContent="📑";
    dup.addEventListener("click",(e)=>{e.stopPropagation(); events.push({...ev}); saveEvents(); generateCalendar(); notify("Épisode dupliqué");});

    const del=document.createElement("span"); del.className="btn del"; del.textContent="❌";
    del.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(confirm("Supprimer cet épisode ?")){events.splice(idx,1); saveEvents(); generateCalendar(); notify("Épisode supprimé");}
    });

    actions.append(chk,dup,del);
    item.append(label,actions);

    item.addEventListener("click",(e)=>{
      if([chk,dup,del].includes(e.target)||e.target.closest("a")) return;
      editIndexInput.value=idx;
      dateInput.value=ev.date;
      titleInput.value=ev.title;
      seasonInput.value=ev.season;
      episodeInput.value=ev.episode;
      currentSeriesTitle=ev.title;
      document.getElementById("deleteSeriesBtn").style.display="inline-block";
      document.getElementById("renameSeriesBtn").style.display="inline-block";
      // Sur mobile, ouvrir le menu si fermé
      if(isMobile()) document.getElementById("collapsibleMenu").classList.add("open");
      episodeInput.focus();
    });
    day.appendChild(item);
  });
  return day;
}

/* ========================================================== */
/* FORMULAIRE */
/* ========================================================== */
document.getElementById("addForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const idx=editIndexInput.value;
  const payload={date:dateInput.value,title:titleInput.value,season:seasonInput.value.trim(),episode:episodeInput.value.trim()};
  if(!payload.date||!payload.title||!payload.season||!payload.episode) return;
  if(idx!=="") events[idx]={...events[idx],...payload};
  else events.push({...payload,watched:false});
  saveEvents(); editIndexInput.value=""; e.target.reset(); dateInput.value=payload.date; generateCalendar();
  notify("✅ Épisode enregistré");
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  editIndexInput.value="";
  document.getElementById("addForm").reset();
  document.getElementById("deleteSeriesBtn").style.display="none";
  document.getElementById("renameSeriesBtn").style.display="none";
});

/* ========================================================== */
/* BOUTONS SÉRIE */
/* ========================================================== */
document.getElementById("deleteSeriesBtn").addEventListener("click",()=>{
  if(!currentSeriesTitle) return;
  if(confirm(`Supprimer tous les épisodes de "${currentSeriesTitle}" ?`)){
    const before=events.length;
    events=events.filter(e=>e.title!==currentSeriesTitle);
    saveEvents(); generateCalendar();
    notify(`🗑 ${before-events.length} épisodes supprimés de "${currentSeriesTitle}"`);
    currentSeriesTitle=null;
    document.getElementById("deleteSeriesBtn").style.display="none";
    document.getElementById("renameSeriesBtn").style.display="none";
  }
});

document.getElementById("renameSeriesBtn").addEventListener("click",()=>{
  if(!currentSeriesTitle) return;
  const newName=prompt("Nouveau nom pour la série :",currentSeriesTitle);
  if(newName&&newName.trim()!==""&&newName!==currentSeriesTitle){
    events.forEach(ev=>{if(ev.title===currentSeriesTitle)ev.title=newName;});
    saveEvents(); generateCalendar();
    notify(`✏️ Série renommée : "${currentSeriesTitle}" → "${newName}"`);
    currentSeriesTitle=newName;
  }
});

/* ========================================================== */
/* EXPORT / IMPORT */
/* ========================================================== */
document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(events,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="calendar_events_manual_export.json"; a.click();
  URL.revokeObjectURL(a.href);
  notify("Sauvegarde exportée");
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=(ev)=>{try{
    const imp=JSON.parse(ev.target.result);
    if(Array.isArray(imp)){events=imp; saveEvents(); generateCalendar(); notify("Import réussi ✅");}
    else notify("JSON invalide","error");
  }catch{notify("Erreur import fichier","error");}};
  r.readAsText(f);
});

/* ========================================================== */
/* TMDB */
/* ========================================================== */
const tmdbSearch=document.getElementById("tmdbSearch");
const tmdbResults=document.getElementById("tmdbResults");
function debounce(fn,ms=350){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

document.addEventListener("click",(e)=>{if(!tmdbResults.contains(e.target)&&!tmdbSearch.contains(e.target))tmdbResults.hidden=true;});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")tmdbResults.hidden=true;});

const performSearch=debounce(async(q)=>{
  tmdbResults.innerHTML="";
  if(!q||q.length<2){tmdbResults.hidden=true;return;}
  const key=getApiKey();
  if(!key||key.includes("⚠️")){tmdbResults.innerHTML="<div>⚠️ Ajoute ta clé TMDB (v3) ci-dessus.</div>";tmdbResults.hidden=false;return;}
  try{
    const [r1,r2]=await Promise.all([
      fetch(`https://api.themoviedb.org/3/search/tv?api_key=${key}&query=${encodeURIComponent(q)}&language=fr-FR&page=1`),
      fetch(`https://api.themoviedb.org/3/search/tv?api_key=${key}&query=${encodeURIComponent(q)}&language=fr-FR&page=2`)
    ]);
    const [d1,d2]=await Promise.all([r1.json(),r2.json()]);
    if(d1.status_code){tmdbResults.innerHTML=`<div>❌ TMDB: ${d1.status_message}</div>`;tmdbResults.hidden=false;return;}
    const list=[...(d1.results||[]),...(d2.results||[])];
    if(list.length===0){tmdbResults.innerHTML=`<div>Aucun résultat pour « ${q} »</div>`;tmdbResults.hidden=false;return;}
    tmdbResults.innerHTML=`<div style="padding:4px 10px;font-size:11px;color:#888">${list.length} résultats</div>`;
    list.forEach(show=>{
      const year=show.first_air_date?show.first_air_date.slice(0,4):"?";
      const origin=show.origin_country?.[0]||"";
      const div=document.createElement("div");
      div.textContent=`${show.name} (${year})${origin?" · "+origin:""}`;
      div.addEventListener("click",()=>{
        tmdbResults.hidden=true;
        document.getElementById("title").value=show.name;
        currentSeriesTitle=show.name;
        document.getElementById("deleteSeriesBtn").style.display="inline-block";
        document.getElementById("renameSeriesBtn").style.display="inline-block";
        loadFromTMDB(show.id);
      });
      tmdbResults.appendChild(div);
    });
    tmdbResults.hidden=false;
  }catch(err){console.error(err);tmdbResults.innerHTML="<div>❌ Erreur réseau TMDB</div>";tmdbResults.hidden=false;}
},350);

tmdbSearch.addEventListener("input",(e)=>performSearch(e.target.value.trim()));

async function loadFromTMDB(tvId){
  const key=getApiKey();
  if(!key||key.includes("⚠️")){notify("Ajoute ta clé TMDB (v3) avant l'import","error");return;}
  try{
    const res=await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${key}&language=fr-FR`);
    const data=await res.json();
    if(data.status_code){notify(`TMDB: ${data.status_message}`,"error");return;}
    const title=data.name;
    const posterUrl=data.poster_path?("https://image.tmdb.org/t/p/w92"+data.poster_path):null;
    const tmdbUrl=`https://www.themoviedb.org/tv/${tvId}`;
    let added=0,updated=0,enriched=0;
    for(const season of (data.seasons||[])){
      if(!season.season_number&&season.season_number!==0) continue;
      const resS=await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${season.season_number}?api_key=${key}&language=fr-FR`);
      const seasonData=await resS.json();
      (seasonData.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const newEv={date:ep.air_date,title,season:"S"+String(ep.season_number).padStart(2,"0"),episode:"E"+String(ep.episode_number).padStart(2,"0"),watched:false,tvId,poster:posterUrl,tmdbUrl};
        const i=events.findIndex(e=>e.title===newEv.title&&e.season===newEv.season&&e.episode===newEv.episode);
        if(i===-1){events.push(newEv);added++;}
        else{if(events[i].date!==newEv.date){events[i].date=newEv.date;updated++;}if((posterUrl&&!events[i].poster)||(tmdbUrl&&!events[i].tmdbUrl)){events[i].poster=posterUrl;events[i].tmdbUrl=tmdbUrl;enriched++;}}
      });
    }
    saveEvents(); generateCalendar();
    notify(`✅ « ${title} » importée (+${added}, ✏️${updated}, 🧩${enriched})`);
  }catch(err){console.error(err);notify("Impossible de charger depuis TMDB","error");}
}

/* ========================================================== */
/* NAVIGATION + INIT */
/* ========================================================== */
document.getElementById("prevBtn").onclick=()=>{
  if(viewMode==="month")currentDate.setMonth(currentDate.getMonth()-1);
  else currentDate.setDate(currentDate.getDate()-7);
  generateCalendar();
};
document.getElementById("nextBtn").onclick=()=>{
  if(viewMode==="month")currentDate.setMonth(currentDate.getMonth()+1);
  else currentDate.setDate(currentDate.getDate()+7);
  generateCalendar();
};
toggleViewBtn.onclick=()=>{
  viewMode=viewMode==="month"?"week":"month";
  toggleViewBtn.textContent=viewMode==="month"?"Basculer en mode Semaine":"Basculer en mode Mois";
  generateCalendar();
};
window.addEventListener("scroll",()=>{document.getElementById("topbar").classList.toggle("scrolled",window.scrollY>10);});
window.addEventListener("resize",()=>generateCalendar());

// Chargement initial depuis le cloud, puis affichage
loadFromCloud().then(()=>generateCalendar());
</script>
