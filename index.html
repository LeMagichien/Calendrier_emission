<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendrier des Émissions</title>
<style>
:root{
  --bg:#0b0d12;
  --surface:#11141b;
  --surface-2:#171b23;
  --surface-3:#1d222c;
  --border:#2a303b;
  --border-soft:#20252e;
  --text:#f4f7fb;
  --muted:#8f98a8;
  --accent:#6ea8ff;
  --accent-2:#3f82f5;
  --success:#35c477;
  --danger:#ff5d78;
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}

body{
  font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(74,126,210,.13),transparent 35%),
    var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  transition:transform .15s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}

button:active{transform:scale(.97)}

h1{
  margin:0;
  font-size:clamp(17px,4vw,23px);
  font-weight:750;
  letter-spacing:-.3px;
}

/* ===== TOPBAR AUTO-HIDE ===== */
#topbar{
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;

  /* État réduit par défaut */
  max-height:38px;
  padding:8px 18px;
  background:rgba(11,13,18,.72);
  transition:max-height .35s cubic-bezier(.4,0,.2,1),
             padding .35s ease,
             background .25s ease,
             box-shadow .25s ease;
  cursor:pointer;
}

#topbar:hover,
#topbar.pinned{
  max-height:600px;
  padding:12px 18px 15px;
  background:rgba(11,13,18,.97);
  box-shadow:0 8px 30px rgba(0,0,0,.38);
  cursor:default;
}

/* Indicateur visuel quand réduit */
#topbar::before{
  content:"▾ CAPTQC — JOURNAL DE BORD";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  letter-spacing:2px;
  font-weight:750;
  color:rgba(201,148,78,.70);
  font-family:Georgia,"Times New Roman",serif;
  pointer-events:none;
  opacity:1;
  transition:opacity .2s ease;
  white-space:nowrap;
}

#topbar:hover::before,
#topbar.pinned::before{
  opacity:0;
}

/* Cacher le contenu quand réduit pour éviter le débordement */
#topbar > *{
  opacity:0;
  transition:opacity .2s ease .05s;
}

#topbar:hover > *,
#topbar.pinned > *{
  opacity:1;
}

#topbar.scrolled{
  box-shadow:0 8px 30px rgba(0,0,0,.38);
}

.topbar-header{
  max-width:1800px;
  width:100%;
}

.topbar-header h1{
  display:flex;
  align-items:center;
  gap:9px;
}

/* ===== NAVIGATION ===== */
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
}

.controls button,
#menuToggle{
  border:1px solid var(--border);
  background:linear-gradient(180deg,#202630,#181c24);
  color:var(--text);
  border-radius:9px;
  padding:7px 11px;
  min-height:34px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.controls button:hover,
#menuToggle:hover{
  background:#252c38;
  border-color:#3b4656;
}

#monthLabel{
  min-width:175px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  text-transform:capitalize;
  color:#fff;
}

#toggleViewBtn{
  margin-left:8px;
  background:linear-gradient(135deg,var(--accent-2),#6b9fff)!important;
  border-color:transparent!important;
  box-shadow:0 5px 18px rgba(63,130,245,.22)!important;
}

#toggleViewBtn:hover{
  filter:brightness(1.08);
}

/* ===== MENU ===== */
#menuToggle{
  display:none;
  font-size:18px;
}

#collapsibleMenu{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
}

/* ===== FORMULAIRE ===== */
form{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
  max-width:1100px;
  padding:10px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border-soft);
  border-radius:13px;
}

form input,
form button,
#tmdbKeyInput,
#tmdbSearch{
  padding:8px 10px;
  font-size:13px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#151920;
  color:var(--text);
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}

form input:focus,
#tmdbKeyInput:focus,
#tmdbSearch:focus{
  border-color:#568cf0;
  box-shadow:0 0 0 3px rgba(86,140,240,.13);
  background:#181d25;
}

form input::placeholder,
#tmdbKeyInput::placeholder,
#tmdbSearch::placeholder{
  color:#70798a;
}

#date{width:145px}
#title{flex:1 1 230px;min-width:180px}
#season,#episode{width:112px}

.btn-group{
  display:flex;
  gap:7px;
}

.btn-primary{
  background:linear-gradient(135deg,#3f82f5,#6ca3ff)!important;
  border-color:transparent!important;
  color:#fff;
  font-weight:650;
  box-shadow:0 5px 15px rgba(63,130,245,.2);
}

.btn-primary:hover{filter:brightness(1.08)}

.btn-secondary{
  background:#191e26!important;
  border-color:#303846!important;
  color:#dbe1eb!important;
}

.btn-secondary:hover{
  background:#232a35!important;
  border-color:#414b5c!important;
}

.extra-controls{
  text-align:center;
}

#collapsibleMenu > .extra-controls:has(#tmdbSearch){width:100%!important;max-width:1100px!important}

#tmdbSearch{
  width:100%!important;
  max-width:none!important;
  display:block;
}

.extra-controls label{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

#tmdbKeyInput{
  max-width:none;
}

#tmdbResults{
  background:#151920;
  color:var(--text);
  border:1px solid var(--border);
  max-height:280px;
  overflow-y:auto;
  margin-top:5px;
  border-radius:10px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:1100px;
  text-align:left;
  overflow-x:hidden;
}

#tmdbResults[hidden]{display:none}

#tmdbResults div{
  padding:9px 12px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.045);
}

#tmdbResults div:last-child{border-bottom:0}

#tmdbResults div:hover{
  background:#222936;
}

/* ===== NOTIFICATION ===== */
#notification{
  position:fixed;
  bottom:22px;
  right:22px;
  background:#2678ee;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.38);
  z-index:10000;
  opacity:0;
  transition:opacity .3s,transform .3s;
  transform:translateY(18px);
  max-width:calc(100vw - 44px);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
  font-weight:600;
}

#notification.show{
  opacity:1;
  transform:translateY(0);
}

#notification.error{background:#c83e58}
#notification.info{background:#b77a18}

/* ===== PROGRESS ===== */
#progressContainer{
  width:80%;
  max-width:600px;
  height:7px;
  background:#202631;
  border-radius:99px;
  overflow:hidden;
  margin-top:3px;
  display:none;
}

#progressBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#3f82f5,#73adff);
  transition:width .2s ease;
}

/* ===== CALENDRIER ===== */
main{
  max-width:1900px;
  margin:0 auto;
}

.calendar{
  display:grid;
  gap:7px;
  margin-top:9px;
}

.calendar.month,
.calendar.week{
  grid-template-columns:repeat(7,1fr);
}

.weekdays{
  font-weight:700;
  text-align:center;
  background:transparent;
  border-radius:11px;
  overflow:hidden;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
  margin-top:10px;
}

.weekdays div{
  padding:9px 0;
  border:1px solid var(--border-soft);
  border-radius:9px;
  background:#15181f;
  font-size:12px;
  color:#aeb7c6;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.day{
  border-radius:11px;
  background:linear-gradient(145deg,#15181e,#12151a);
  min-height:145px;
  display:flex;
  flex-direction:column;
  position:relative;
  padding:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .15s,background .2s,border-color .2s;
  border:1px solid var(--border-soft);
  overflow:hidden;
}

.day:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 22px rgba(0,0,0,.32);
  border-color:#303744;
}

.day-number{
  font-weight:750;
  font-size:13px;
  color:#8f99aa;
  position:absolute;
  top:7px;
  right:9px;
  z-index:2;
}

.day.drag-over{
  outline:2px dashed var(--accent);
  outline-offset:-3px;
  background:#151f31;
}

.day.today{
  border-color:rgba(110,168,255,.65);
  box-shadow:0 0 0 1px rgba(110,168,255,.12),0 6px 18px rgba(40,90,170,.16);
}

.day.today .day-number{
  color:#8bb8ff;
  background:rgba(82,140,235,.13);
  border-radius:7px;
  padding:2px 6px;
}

.day:has(.event){
  background:linear-gradient(145deg,#171b22,#13171d);
}

/* ===== EVENTS ===== */
.event{
  background:linear-gradient(135deg,#2788ee,#4f9bf4);
  color:#fff;
  font-size:11.5px;
  margin-top:25px;
  padding:5px 6px;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:7px;
  cursor:grab;
  transition:transform .15s,box-shadow .15s,filter .15s;
  min-height:39px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 3px 9px rgba(0,0,0,.17);
}

.event + .event{margin-top:5px}

.event:active{cursor:grabbing}

.event:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(0,0,0,.3);
  filter:brightness(1.05);
}

.event.watched{
  background:linear-gradient(135deg,#239552,#45bf77);
}

.event img{
  width:26px;
  height:36px;
  object-fit:cover;
  border-radius:5px;
  flex-shrink:0;
  background:rgba(0,0,0,.2);
}

.event > span:not(.btn){
  line-height:1.25;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event .actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-left:auto;
  flex-shrink:0;
}

.event .actions .btn{
  font-size:13px;
  padding:2px;
  cursor:pointer;
  opacity:.85;
  transition:opacity .15s,transform .15s;
}

.event .actions .btn:hover{
  opacity:1;
  transform:scale(1.12);
}

.event .actions input[type="checkbox"]{
  width:13px;
  height:13px;
  margin:0;
  accent-color:#fff;
  cursor:pointer;
}

.event .btn.del{color:#ffe0e5}
.event .btn.dup{color:#fff3bd}

/* ===== MOBILE ===== */
@media (max-width: 900px){
  .day{min-height:125px}
  .event{font-size:11px}
  .event img{width:23px;height:32px}
}

@media (max-width: 640px){
  #topbar{
    padding:10px 10px 12px;
    gap:9px;
  }

  #menuToggle{
    display:block;
  }

  #collapsibleMenu{
    display:none;
  }

  #collapsibleMenu.open{
    display:flex;
  }

  .topbar-header{
    display:flex!important;
    width:100%;
    justify-content:space-between;
    align-items:center;
  }

  .controls{
    width:100%;
    justify-content:space-between;
    gap:6px;
  }

  #monthLabel{
    min-width:0;
    flex:1;
    font-size:14px;
  }

  #toggleViewBtn{
    margin-left:0;
    width:100%;
  }

  form{
    flex-direction:column;
    align-items:stretch;
    padding:9px;
  }

  form input,
  form button,
  #tmdbKeyInput,
  #tmdbSearch{
    width:100%;
    box-sizing:border-box;
  }

  #date,#title,#season,#episode{
    width:100%;
    flex:none;
    min-width:unset;
  }

  .btn-group{
    justify-content:stretch;
  }

  .btn-group button{
    flex:1;
  }

  .extra-controls{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:7px!important;
  }

  .extra-controls button,
  .extra-controls input[type=text]{
    width:100%;
    box-sizing:border-box;
  }

  .weekdays{
    display:none;
  }

  /* Vue mois = agenda mobile */
  .calendar.month{
    display:flex!important;
    flex-direction:column;
    gap:0;
  }

  .calendar.month .day{
    min-height:unset;
    border-radius:0;
    border:none;
    border-bottom:1px solid var(--border-soft);
    padding:10px 10px 9px;
    background:transparent;
    box-shadow:none;
  }

  .calendar.month .day:hover{
    transform:none;
    box-shadow:none;
  }

  .calendar.month .day:empty{
    display:none;
  }

  .calendar.month .day-number{
    position:static;
    display:inline-block;
    font-size:13px;
    color:#9da7b7;
    margin-bottom:5px;
  }

  .calendar.month .day-label{
    font-size:11px;
    color:#697384;
    text-transform:uppercase;
    margin-bottom:5px;
    display:block;
    letter-spacing:.3px;
  }

  .calendar.month .event{
    margin-top:4px;
    font-size:12.5px;
    min-height:43px;
  }

  .calendar.week{
    grid-template-columns:1fr;
    gap:5px;
  }

  .calendar.week .day{
    min-height:58px;
    border-radius:9px;
  }

  .calendar.week .day-number::before{
    content:attr(data-dayname) " ";
    font-size:11px;
    color:#697384;
    font-weight:500;
  }

  .event{
    font-size:13px;
    padding:7px 8px;
  }

  .event img{
    width:28px;
    height:38px;
  }

  .event .btn{
    font-size:15px;
  }

  #notification{
    left:12px;
    right:12px;
    bottom:14px;
    text-align:center;
    max-width:none;
  }
}

/* ==========================================================
   PREMIUM UI — Calendrier des Émissions
   ========================================================== */

:root{
  --premium-accent:#7c9cff;
  --premium-accent-2:#a879ff;
  --premium-glow:rgba(124,156,255,.22);
  --premium-card:rgba(19,23,31,.82);
  --premium-card-strong:#151a23;
}

body{
  background:
    radial-gradient(900px 500px at 12% -8%,rgba(124,156,255,.14),transparent 60%),
    radial-gradient(800px 500px at 88% 0%,rgba(168,121,255,.10),transparent 60%),
    linear-gradient(180deg,#090b10 0%,#0b0e14 55%,#090b10 100%);
}

/* Topbar premium */
#topbar{
  padding:14px 20px 16px;
  background:rgba(8,10,15,.78);
  border-bottom:1px solid rgba(255,255,255,.075);
}

.topbar-header h1{
  font-size:22px;
  letter-spacing:-.6px;
}

.topbar-header h1:first-letter{
  filter:drop-shadow(0 0 8px rgba(124,156,255,.55));
}

.controls{
  max-width:1100px;
  margin:auto;
}

.controls button{
  min-width:38px;
  border-radius:10px;
}

#monthLabel{
  font-size:17px;
  min-width:220px;
}

#toggleViewBtn{
  padding:8px 14px!important;
}

/* Statistiques */
#premiumStats{
  width:100%;
  max-width:1100px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 auto 2px;
}

.premium-stat{
  position:relative;
  overflow:hidden;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:linear-gradient(145deg,rgba(25,30,40,.9),rgba(14,17,23,.9));
  box-shadow:0 7px 22px rgba(0,0,0,.16);
}

.premium-stat::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-35px;
  top:-35px;
  border-radius:50%;
  background:var(--premium-glow);
  filter:blur(2px);
}

.premium-stat-label{
  display:block;
  color:#7f8999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:700;
}

.premium-stat-value{
  display:block;
  margin-top:2px;
  color:#f6f8fc;
  font-size:20px;
  line-height:1.1;
  font-weight:800;
}

.premium-stat-sub{
  color:#667080;
  font-size:10px;
}

/* Zone outils */
#collapsibleMenu{
  width:100%;
  max-width:1100px;
}

form{
  position:relative;
  background:linear-gradient(145deg,rgba(24,29,39,.92),rgba(14,17,23,.92));
  border-color:rgba(255,255,255,.075);
  box-shadow:0 12px 35px rgba(0,0,0,.15);
}

form::before{
  content:"AJOUTER / MODIFIER";
  position:absolute;
  left:12px;
  top:-8px;
  padding:0 7px;
  background:#10141b;
  color:#697486;
  font-size:9px;
  letter-spacing:1px;
  font-weight:800;
}

/* Recherche TMDB */
#tmdbSearch{
  width:100%!important;
  max-width:none!important;
  height:39px;
  background:rgba(20,24,32,.92);
}

#tmdbKeySetup{
  animation:premiumKeyFade .25s ease;
}
@keyframes premiumKeyFade{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

#tmdbSearch::placeholder{
  color:#667184;
}

/* Boutons */
.btn-primary{
  background:linear-gradient(135deg,#597ff5,#8b72f7)!important;
  box-shadow:0 7px 22px rgba(92,121,246,.24)!important;
}

.btn-secondary{
  background:linear-gradient(180deg,#1b212b,#151a22)!important;
}

/* En-têtes calendrier */
.weekdays{
  position:sticky;
  top:108px;
  z-index:50;
  padding:0 1px;
  background:transparent;
}

.weekdays div{
  background:linear-gradient(180deg,#1a202a,#151a22);
  border-color:#252c37;
  box-shadow:0 4px 13px rgba(0,0,0,.16);
}

/* Cellules */
.day{
  min-height:152px;
  border-color:#222832;
  background:
    linear-gradient(145deg,rgba(22,26,34,.96),rgba(14,17,23,.96));
}

.day:hover{
  border-color:#353e4d;
}

.day.today{
  border-color:rgba(124,156,255,.72);
  box-shadow:
    0 0 0 1px rgba(124,156,255,.10),
    0 0 28px rgba(76,108,190,.10),
    0 10px 24px rgba(0,0,0,.28);
}

.day.today::before{
  content:"AUJOURD’HUI";
  position:absolute;
  top:7px;
  left:7px;
  padding:2px 6px;
  border-radius:5px;
  background:rgba(124,156,255,.12);
  color:#8eaeff;
  font-size:8px;
  letter-spacing:.65px;
  font-weight:800;
}

.day-number{
  font-size:13px;
  color:#8994a6;
}

/* Événements premium */
.event{
  position:relative;
  min-height:44px;
  padding:6px 7px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(135deg,rgba(54,137,238,.96),rgba(71,105,225,.96));
  box-shadow:0 5px 13px rgba(0,0,0,.20);
}

.event.watched{
  background:
    linear-gradient(135deg,rgba(35,157,87,.97),rgba(49,177,107,.97));
}

.event:hover{
  box-shadow:0 8px 20px rgba(0,0,0,.30);
}

.event img{
  width:29px;
  height:38px;
  border-radius:6px;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
}

.event > span:not(.btn){
  font-weight:600;
}

.event .actions{
  gap:4px;
}

.event .actions .btn{
  opacity:.75;
}

/* Légende */
#premiumLegend{
  max-width:1100px;
  width:100%;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:14px;
  color:#737e8f;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  box-shadow:0 0 8px currentColor;
}

.legend-dot.next{color:#4f9bf4;background:#4f9bf4}
.legend-dot.watched{color:#45bf77;background:#45bf77}

/* ==========================================================
   V5 — NEON / STREAMING DASHBOARD
   ========================================================== */

:root{
  --fly-blue:#42a5ff;
  --fly-violet:#9b6cff;
  --fly-pink:#ff5fa2;
  --fly-cyan:#42e8ff;
  --fly-green:#43df8a;
  --fly-gold:#ffc45c;
  --fly-bg:#07090f;
  --fly-panel:rgba(13,17,27,.88);
  --fly-line:rgba(255,255,255,.08);
}

/* Fond plus spectaculaire */
body{
  background:
    radial-gradient(700px 360px at 8% -5%,rgba(66,165,255,.17),transparent 65%),
    radial-gradient(700px 360px at 92% 0%,rgba(155,108,255,.16),transparent 65%),
    radial-gradient(600px 330px at 55% 100%,rgba(255,95,162,.07),transparent 65%),
    linear-gradient(180deg,#05070b 0%,#090d15 48%,#06080d 100%);
}

/* Liseré lumineux supérieur */
#topbar{
  position:sticky;
  background:
    linear-gradient(180deg,rgba(7,10,16,.96),rgba(7,10,16,.80));
  border-bottom:1px solid rgba(103,157,255,.20);
  box-shadow:0 8px 35px rgba(0,0,0,.28);
}

#topbar::after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,#4fa3ff 25%,#a56eff 60%,#ff61a8 82%,transparent);
  opacity:.55;
}

/* Titre */
.topbar-header h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:850;
  letter-spacing:.1px;
  text-shadow:0 2px 0 #34200f,0 4px 12px rgba(0,0,0,.55);
}

.topbar-header h1::after{
  content:"";
  display:block;
}

/* Navigation */
.controls button{
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,#1b2230,#111721);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 5px 16px rgba(0,0,0,.22);
}

.controls button:hover{
  border-color:rgba(102,170,255,.52);
  box-shadow:
    0 0 0 1px rgba(102,170,255,.08),
    0 8px 22px rgba(31,95,180,.16);
}

#monthLabel{
  font-size:18px;
  font-weight:850;
  text-shadow:0 0 15px rgba(126,170,255,.13);
}

#toggleViewBtn{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#377df2 0%,#7a5ff2 55%,#b867d7 100%)!important;
  box-shadow:
    0 7px 24px rgba(84,110,241,.25),
    inset 0 1px 0 rgba(255,255,255,.17)!important;
}

#toggleViewBtn::after{
  content:"";
  position:absolute;
  top:-80%;
  left:-25%;
  width:35%;
  height:260%;
  transform:rotate(22deg);
  background:rgba(255,255,255,.14);
  transition:left .5s ease;
}

#toggleViewBtn:hover::after{left:120%}

/* Stats */

  gap:10px;
}
